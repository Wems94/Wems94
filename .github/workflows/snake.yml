name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate animated Core Stack SVG
        run: |
          pip install requests -q
          python3 - <<'EOF'
          import requests, base64, re, os

          icons = "py,gcp,aws,git,github,githubactions,notion"
          r = requests.get(f"https://skillicons.dev/icons?i={icons}", timeout=30)
          svg = r.text

          W = round(float(re.search(r'<svg[^>]+width="([^"]+)"', svg).group(1)))
          H = round(float(re.search(r'<svg[^>]+height="([^"]+)"', svg).group(1)))
          b64 = base64.b64encode(svg.encode()).decode()

          out = f"""<svg width="{W}" height="{H}" viewBox="0 0 {W} {H}" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .m {{ animation: s 22s linear infinite; }}
                @keyframes s {{ 0% {{ transform: translateX(0); }} 100% {{ transform: translateX(-{W}px); }} }}
              </style>
              <linearGradient id="g" x1="0%" x2="100%">
                <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
                <stop offset="12%" stop-color="#fff"/>
                <stop offset="88%" stop-color="#fff"/>
                <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <mask id="f"><rect width="{W}" height="{H}" fill="url(#g)"/></mask>
            </defs>
            <g mask="url(#f)">
              <g class="m">
                <image href="data:image/svg+xml;base64,{b64}" width="{W}" height="{H}"/>
                <image href="data:image/svg+xml;base64,{b64}" x="{W}" width="{W}" height="{H}"/>
              </g>
            </g>
          </svg>"""

          os.makedirs("dist", exist_ok=True)
          with open("dist/core-stack-animated.svg", "w") as f:
              f.write(out)
          print(f"Generated: {W}x{H}px")
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
